name: Daily site bots

on:
  schedule:
    - cron: "15 4 * * *"   # 07:45 Tehran
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Health check (all pages, images, checkout APIs)
        run: python health.py
      - name: IndexNow ping for changed pages
        if: always()
        run: python indexnow.py
      - name: Search Console report
        if: always()
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet google-auth requests
          python gsc_report.py
